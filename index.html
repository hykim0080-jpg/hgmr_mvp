<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한글마루 - V7 파이어베이스 연동</title>
    <style>
        body { background-color: #f1f5f9; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .app-wrapper { width: 100%; max-width: 550px; }
        .dashboard { display: flex; justify-content: space-between; background-color: #1e293b; color: white; padding: 15px 25px; border-radius: 16px 16px 0 0; font-weight: bold; font-size: 14px; }
        .exp-bar-container { width: 100px; height: 8px; background-color: #475569; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .exp-fill { height: 100%; background-color: #f59e0b; width: 0%; transition: width 0.5s ease; }
        .quiz-container { background-color: white; padding: 40px; border-radius: 0 0 16px 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); text-align: center; position: relative; }
        .progress-bar { width: 100%; height: 6px; background-color: #e2e8f0; border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #10b981; width: 0%; transition: width 0.3s ease; }
        .sentence { font-size: 22px; font-weight: bold; color: #1e293b; margin-bottom: 15px; line-height: 1.6; word-break: keep-all; min-height: 90px; }
        .meaning { font-size: 15px; color: #64748b; margin-bottom: 30px; background-color: #f8fafc; padding: 12px; border-radius: 8px; display: inline-block; line-height: 1.4; }
        .level-badge { background-color: #3b82f6; color: white; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-right: 8px; vertical-align: middle; }
        .input-group { display: flex; gap: 8px; justify-content: center; }
        input[type="text"] { padding: 15px 20px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 12px; width: 50%; text-align: center; outline: none; transition: all 0.2s; font-weight: bold; }
        input[type="text"]:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        button { padding: 15px 20px; font-size: 16px; font-weight: bold; color: white; background-color: #10b981; border: none; border-radius: 12px; cursor: pointer; transition: background-color 0.2s; white-space: nowrap; }
        button:hover { background-color: #059669; }
        button.btn-secondary { background-color: #94a3b8; }
        button.btn-secondary:hover { background-color: #64748b; }
        
        .correct input { border-color: #10b981; background-color: #ecfdf5; color: #047857; }
        .synonym input { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; }
        .wrong input { border-color: #ef4444; background-color: #fef2f2; animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .show-answer input { border-color: #ef4444; background-color: #fef2f2; color: #b91c1c; }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .result-screen { display: none; }
        .result-screen h2 { color: #10b981; margin-bottom: 10px; }
        .result-screen .stats { font-size: 18px; color: #475569; margin-bottom: 30px; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="login-screen" style="text-align: center; margin-top: 50px;">
        <h1>한글마루</h1>
        <button id="google-login-btn">구글 계정으로 시작하기</button>
        <br><br>
        <button id="anon-login-btn">로그인 없이 시작하기</button>
      </div>
    
      <!-- 2. 기존 코드(퀴즈, 경험치 바 등)가 시작되기 직전에 app-screen 여는 태그를 넣는다. -->
      <div id="app-screen" style="display: none;">
    <div class="app-wrapper">
        <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 12px; font-size: 15px;">
            <span id="user-info" style="font-weight: bold; margin-right: 12px; color: #475569;">로그인 정보 불러오는 중...</span>
            <button id="logout-btn" style="padding: 6px 14px; font-size: 13px; background-color: #ef4444; border-radius: 8px;">로그아웃</button>
        </div>
        <div class="dashboard" id="dashboard">
            <div>🔥 연속 학습: <span id="streak-text">-일차</span></div>
            <div style="text-align: right;">
                ⭐ Lv.<span id="level-text">-</span> (<span id="exp-text">0</span>/200)
                <div class="exp-bar-container"><div class="exp-fill" id="exp-bar"></div></div>
            </div>
        </div>
        <div class="quiz-container" id="quiz-box">
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <div class="sentence" id="sentence-text">데이터를 동기화하는 중입니다...</div>
            <div class="meaning" id="meaning-text"></div>
            <div class="input-group" id="input-group">
                <input type="text" id="answer-input" placeholder="정답 입력" autocomplete="off" disabled>
                <button id="submit-btn" disabled>제출</button>
                <button id="show-answer-btn" class="btn-secondary" disabled>정답 보기</button>
            </div>
        </div>
        <div class="quiz-container result-screen" id="result-box">
            <h2>🎉 오늘의 미션 완료!</h2>
            <div class="stats">
                현재 누적 경험치: <strong style="color:#f59e0b;"><span id="final-exp">0</span> EXP</strong><br>
                재학습한 단어 수: <strong id="retry-count">0</strong>개
            </div>
            <button onclick="location.reload()">다시 복습하기</button>
        </div>
    </div>
</div>

    <!-- 파이어베이스 모듈을 사용하기 위해 type="module" 선언 -->
   <!-- 파이어베이스 모듈을 사용하기 위해 type="module" 선언 -->
   <script type="module">
    // ===== 1. 파이어베이스 SDK 불러오기 및 초기화 (버전 11.0.0으로 완벽 통일!) =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDSSvJSfL0B8lRflALTZvKjcoDRsYE01Sg",
        authDomain: "hgmr-9109e.firebaseapp.com",
        projectId: "hgmr-9109e",
        storageBucket: "hgmr-9109e.firebasestorage.app",
        messagingSenderId: "212108763277",
        appId: "1:212108763277:web:0b2fdb82863d096a5102c4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    let userDocRef; // 유저별 DB 주소를 담을 변수

    // ===== 2. 전역 상태 변수 =====
    let currentExp = 0;
    let streakDays = 1;
    let lastDate = null;
    let quizQueue = [];
    let totalQuestions = 0; 
    let completedQuestions = 0; 
    let retryCount = 0;
    let isWaiting = false; 
    let hasFailedCurrent = false;

    // DOM 요소
    const sentenceEl = document.getElementById('sentence-text'); 
    const meaningEl = document.getElementById('meaning-text');
    const inputEl = document.getElementById('answer-input'); 
    const submitBtn = document.getElementById('submit-btn');
    const showAnswerBtn = document.getElementById('show-answer-btn'); 
    const inputGroup = document.getElementById('input-group');
    const progressEl = document.getElementById('progress'); 
    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box'); 
    const dashboard = document.getElementById('dashboard');

    // ===== 3. 로그인 및 인증 로직 =====
    document.getElementById("google-login-btn").addEventListener("click", () => {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => console.error("구글 로그인 실패:", err));
    });

    document.getElementById("anon-login-btn").addEventListener("click", () => {
        signInAnonymously(auth).catch(err => console.error("익명 로그인 실패:", err));
    });

    // 로그인 상태 감지 (여기서 앱 실행 여부를 결정!)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            const userInfoEl = document.getElementById("user-info");
                if (user.isAnonymous) {
                    userInfoEl.textContent = "👻 익명 사용자";
                } else {
                    // 구글 로그인인 경우 이름 표시 (이름이 없으면 이메일 표시)
                    userInfoEl.textContent = `⭐ ${user.displayName || user.email} 님`;
                }
            // 로그인이 확인되면 앱 화면을 띄운다.
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";

            // 해당 유저만의 고유 ID로 DB 공간 설정
            userDocRef = doc(db, "users", user.uid);

            // 유저 정보가 세팅되었으니, 이제 퀴즈 데이터를 불러오고 앱을 시작한다!
            initApp();
            
        } else {
            // 로그아웃 상태이면 로그인 화면만 보여준다.
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("app-screen").style.display = "none";
        }
    });
    // 👇 새롭게 추가하는 로그아웃 버튼 동작 로직 👇
    document.getElementById("logout-btn").addEventListener("click", () => {
            signOut(auth).then(() => {
                // 로그아웃이 완료되면 화면을 완전히 새로고침하여 초기 상태로 돌림
                location.reload(); 
            }).catch((error) => {
                console.error("로그아웃 실패:", error);
            });
        });

    // ===== 4. 앱 초기화 (Firestore 데이터 로드) =====
    async function initApp() {
        try {
            // 기존 코드를 그대로 유지! (userDocRef는 이제 로그인한 유저의 방을 가리킴)
            const docSnap = await getDoc(userDocRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                currentExp = data.exp || 0;
                streakDays = data.streak || 1;
                lastDate = data.last_date || null;
            } else {
                // 처음 온 유저라면 경험치 0으로 초기 세팅
                currentExp = 0;
                await syncUserData(); 
            }

            const today = new Date().toLocaleDateString();
            if (lastDate !== today) {
                let yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (lastDate === yesterday.toLocaleDateString()) {
                    streakDays++; 
                } else if (lastDate !== null) {
                    streakDays = 1; 
                }
                lastDate = today;
                await syncUserData();
            }

            await fetchQuizData();

        } catch (error) {
            console.error("Firestore 초기화 에러:", error);
            sentenceEl.textContent = "데이터베이스 연결에 실패했습니다.";
        }
    }

    // ===== 5. Firestore에 데이터 동기화 (저장) 함수 =====
    async function syncUserData() {
        try {
            await setDoc(userDocRef, {
                exp: currentExp,
                streak: streakDays,
                last_date: lastDate
            }, { merge: true }); 
        } catch (error) {
            console.error("데이터 저장 실패:", error);
        }
    }

    // ===== 6. 퀴즈 로직 =====
    async function fetchQuizData() {
        try {
            const response = await fetch('words.json'); 
            const data = await response.json(); 
            
            quizQueue = data;
            totalQuestions = quizQueue.length;
            
            submitBtn.disabled = false;
            showAnswerBtn.disabled = false;
            loadQuestion(); 
        } catch (error) {
            console.error("단어 데이터 로드 실패:", error);
            sentenceEl.textContent = "단어 데이터를 불러오는 데 실패했습니다.";
        }
    }

    function updateDashboard() {
        const currentLevel = Math.floor(currentExp / 200) + 1; 
        const expInLevel = currentExp % 200; 
        
        document.getElementById('streak-text').textContent = `${streakDays}일차`;
        document.getElementById('level-text').textContent = currentLevel;
        document.getElementById('exp-text').textContent = expInLevel;
        document.getElementById('exp-bar').style.width = `${(expInLevel / 200) * 100}%`;
        
        syncUserData();
    }

    function loadQuestion() {
        isWaiting = false; hasFailedCurrent = false;
        updateDashboard();

        if (quizQueue.length === 0) { showResult(); return; }
        const currentWord = quizQueue[0];
        sentenceEl.innerHTML = currentWord.sentence.replace('____', '<span style="color:#94a3b8; border-bottom: 2px dashed #cbd5e1;">____</span>');
        meaningEl.innerHTML = `<span class="level-badge">Lv.${currentWord.level}</span>💡 ${currentWord.meaning}`;
        inputEl.value = ''; inputEl.placeholder = '정답 입력'; inputGroup.className = 'input-group'; inputEl.disabled = false;
        progressEl.style.width = `${(completedQuestions / totalQuestions) * 100}%`;
        inputEl.focus();
    }

    function checkAnswer() {
        if (quizQueue.length === 0 || isWaiting) return;
        const userAnswer = inputEl.value.trim();
        if (userAnswer === "") return; 

        const currentWord = quizQueue[0];

        if (userAnswer === currentWord.target) {
            isWaiting = true;
            inputGroup.classList.remove('wrong', 'show-answer', 'synonym'); inputGroup.classList.add('correct');
            inputEl.value = currentWord.target;
            sentenceEl.innerHTML = currentWord.sentence.replace('____', `<span style="color:#10b981; font-weight:800;">${currentWord.target}</span>`);
            
            if (!hasFailedCurrent) currentExp += 20; 
            
            quizQueue.shift(); completedQuestions++;
            updateDashboard(); 
            setTimeout(loadQuestion, 800);

        } else if (currentWord.accepts && currentWord.accepts.includes(userAnswer)) {
            isWaiting = true;
            inputGroup.classList.remove('wrong', 'show-answer', 'correct'); inputGroup.classList.add('synonym');
            inputEl.value = `${userAnswer} (정답: ${currentWord.target})`;
            sentenceEl.innerHTML = currentWord.sentence.replace('____', `<span style="color:#3b82f6; font-weight:800;">${currentWord.target}</span>`);
            
            if (!hasFailedCurrent) currentExp += 20;
            
            quizQueue.shift(); completedQuestions++;
            updateDashboard(); 
            setTimeout(loadQuestion, 1500);

        } else {
            inputGroup.classList.remove('wrong', 'show-answer', 'synonym'); void inputGroup.offsetWidth; 
            inputGroup.classList.add('wrong'); inputEl.value = ''; inputEl.placeholder = '다시 시도해보세요!';
            
            if (!hasFailedCurrent) {
                hasFailedCurrent = true; totalQuestions++; retryCount++;
                quizQueue.push({...currentWord}); 
            }
        }
    }

    function revealAnswer() {
        if (quizQueue.length === 0 || isWaiting) return;
        isWaiting = true;
        const currentWord = quizQueue[0];
        inputGroup.classList.remove('wrong', 'correct', 'synonym'); inputGroup.classList.add('show-answer');
        inputEl.value = currentWord.target; inputEl.disabled = true;
        sentenceEl.innerHTML = currentWord.sentence.replace('____', `<span style="color:#ef4444; font-weight:800; text-decoration: underline;">${currentWord.target}</span>`);
        
        if (!hasFailedCurrent) {
            hasFailedCurrent = true; totalQuestions++; retryCount++;
            quizQueue.push({...currentWord});
        }
        quizQueue.shift();
        setTimeout(loadQuestion, 2000);
    }

    function showResult() {
        dashboard.style.display = 'none'; quizBox.style.display = 'none'; resultBox.style.display = 'block';
        document.getElementById('final-exp').textContent = currentExp; 
        document.getElementById('retry-count').textContent = retryCount;
    }

    // 이벤트 리스너 등록
    submitBtn.addEventListener('click', checkAnswer);
    showAnswerBtn.addEventListener('click', revealAnswer);
    inputEl.addEventListener('keypress', function(e) { if (e.key === 'Enter') checkAnswer(); });

</script>
</body>
</html>
